name: Make Matlab release

on:
    release:
      types: [published]

jobs:
    deploy:
        if: startsWith(github.ref, 'refs/tags/Matlab')
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v1

        - name: Get release
          id: get_release
          uses: bruceadams/get-release@v1.3.2
          env:
            GITHUB_TOKEN: ${{ github.token }}

        - name: Make zip
          run: |
            find . -not -path '*/\.*' -not -path './ppm/*'  -not -path './Blender Add-on/*' -not -name setup.py -not -name test.py -not -name requirements.txt  -not -path ./ppm -not -path ./Blender\ Add-on | zip $( basename $PWD )_${{ github.ref }}.zip -@
        - name: Upload release asset
          uses: actions/upload-release-asset@v1.0.2
          env:
            GITHUB_TOKEN: ${{ github.token }}
          with:
            upload_url: ${{ steps.get_release.outputs.upload_url }}
            asset_path: './$(basename -s .git $( basename $PWD )_${{ github.ref }}.zip'
            asset_name: '$(basename -s .git $( basename $PWD )_${{ github.ref }}.zip'
            asset_content_type: 'application/zip'
