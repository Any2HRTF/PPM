name: Build Model Documentation(PDF)


on:
  release:
    types: [published]


jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v1

    - name: Get release
      id: get_release
      uses: bruceadams/get-release@v1.3.2
      env:
        GITHUB_TOKEN: ${{ github.token }}
  
    - name: Setup TeX Live
      uses: teatimeguest/setup-texlive-action@v2
      with:
        packages: >-
          scheme-full


    - name: Set up Python
      uses: actions/setup-python@v1
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install sphinx
        pip install -r requirements.txt
    - name: Build 
      if: always()
      run: |
        cd docs
        make latexpdf
    - name: compile Latex
      if: always()
      run: |
        cd ${{ github.workspace }}/docs/_build/latex
        pdflatex ppm.tex
    - name: Upload PDF
      if: always()
      uses: actions/upload-release-asset@v1.0.2
      env:
        GITHUB_TOKEN: ${{ github.token }}
      with:
        upload_url: ${{ steps.get_release.outputs.upload_url }}
        asset_path: ${{ github.workspace }}/docs/_build/latex/ppm.pdf
        asset_name: ppm.pdf
        asset_content_type: application/pdf
