name: Make Blender Add-on release

on:
    release:
      types: [published]

jobs:
    deploy:
        if: startsWith(github.ref, 'refs/tags/bezier-ppm')
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v1

        - name: Get release
          id: get_release
          uses: bruceadams/get-release@v1.3.2
          env:
            GITHUB_TOKEN: ${{ github.token }}

        - name: Make zip
          run: |
            zip -r 'PointCloudCompare.zip' 'Blender Add-on'

        - name: Upload release asset
          uses: actions/upload-release-asset@v1.0.2
          env:
            GITHUB_TOKEN: ${{ github.token }}
          with:
            upload_url: ${{ steps.get_release.outputs.upload_url }}
            asset_path: './PointCloudCompare.zip'
            asset_name: 'PointCloudCompare.zip'
            asset_content_type: 'application/zip'
            
        - name: Upload release asset 2
          uses: actions/upload-release-asset@v1.0.2
          env:
            GITHUB_TOKEN: ${{ github.token }}
          with:
            upload_url: ${{ steps.get_release.outputs.upload_url }}
            asset_path: './ppm/resources/PPM.blend'
            asset_name: 'PPM.blend'
            asset_content_type: 'application/zip'
