name: Build Python Wheel


on:
  release:
    types: [published]


jobs:
  deploy:
    if: startsWith(github.ref, 'refs/tags/pybezierppm')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Set up pip cache
      if: runner.os == 'Linux'
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
        restore-keys: ${{ runner.os }}-pip-
    - name: Install uv
      run: pipx install uv
    - name: Build dist
      run: uv build
    - run: ls ./dist
    - name: Get python package version
      id: get_version
      run: |
        cd dist
        echo ::set-output name=WHEEL::$(ls *.whl)
    - name: Upload release binary
      uses: actions/upload-release-asset@v1.0.2
      env:
        GITHUB_TOKEN: ${{ github.token }}
      with:
        upload_url: ${{ steps.get_release.outputs.upload_url }}
        asset_path: ${{ github.workspace }}/dist/${{ steps.get_version.outputs.WHEEL }}
        asset_name: ${{ steps.get_version.outputs.WHEEL }}
        asset_content_type: application/zip
